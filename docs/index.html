<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Do's">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
body { margin: 0; }
</style>
<title>Daily Do's</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Date and progress first, today's checklist, a 7-day strip, then task setup. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --ink: #14201E;
  --muted: #5B6B68;
  --line: #D7DFDD;
  --accent: #0B6E6E;
  --accent-ink: #FFFFFF;
  --danger: #B3342B;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1514; --surface: #162120; --ink: #E8F0EE; --muted: #93A5A1;
    --line: #263634; --accent: #3FBFB5; --accent-ink: #06201E; --danger: #F08A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514; --surface: #162120; --ink: #E8F0EE; --muted: #93A5A1;
  --line: #263634; --accent: #3FBFB5; --accent-ink: #06201E; --danger: #F08A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1.05; letter-spacing: -0.02em; }
h2 { font-size: 1.05rem; letter-spacing: -0.005em; }
.eyebrow { font: 500 0.72rem/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 0.95rem; }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 16px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s ease; }
.count { font: 500 0.85rem var(--mono); color: var(--muted); margin-top: 12px; font-variant-numeric: tabular-nums; }

ul { list-style: none; margin: 0; padding: 0; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.list li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-width: 0; }
.row label { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; cursor: pointer; }
.row .t { overflow-wrap: anywhere; }
.row.done .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
input[type="checkbox"].chk {
  appearance: none; -webkit-appearance: none; flex: none;
  width: 24px; height: 24px; margin: 0; border: 1.5px solid var(--muted); border-radius: 6px;
  background: transparent; display: grid; place-content: center; cursor: pointer;
}
input[type="checkbox"].chk:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"].chk:checked::after {
  content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { padding: 22px 16px; color: var(--muted); }
.note { color: var(--muted); font-size: 0.9rem; margin: 10px 2px 0; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 12px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.day .col { width: 100%; height: 64px; border-radius: 6px; background: var(--line); position: relative; overflow: hidden; }
.day .col > i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
.day .l { font: 500 0.7rem var(--mono); color: var(--muted); letter-spacing: 0.06em; }
.day .n { font: 500 0.72rem var(--mono); font-variant-numeric: tabular-nums; }
.day.today .l { color: var(--ink); font-weight: 500; }
.day.today .col { outline: 2px solid var(--ink); outline-offset: 2px; }

form { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 12px; }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.f > span, legend { font: 500 0.72rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="date"], input[type="number"], select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0;
}
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; font: 500 0.8rem var(--mono); background: var(--bg); }
.chips input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: 600 0.95rem var(--body); cursor: pointer; border-radius: 8px; border: 0; padding: 11px 16px; }
.primary { background: var(--accent); color: var(--accent-ink); align-self: flex-start; }
.ghost { background: transparent; color: var(--muted); padding: 6px 8px; font-weight: 500; font-size: 0.85rem; }
.ghost:hover { color: var(--danger); }
.when { font: 400 0.78rem var(--mono); color: var(--muted); }
.stack { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.err { color: var(--danger); font-size: 0.9rem; margin: 0; min-height: 1.2em; }

.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.status { margin: 0; font-size: 0.95rem; }
.hint { margin: 0; color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
<style>
body { padding-top: calc(28px + env(safe-area-inset-top, 0px)); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
</style>

<main>
  <header>
    <p class="eyebrow" id="weekday">Today</p>
    <h1 id="dateLine">&nbsp;</h1>
    <p class="count" id="count">Loading your list…</p>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  </header>

  <section aria-labelledby="todayH">
    <h2 id="todayH">To do today</h2>
    <div class="list" style="margin-top:12px"><ul id="today"><li class="empty">Loading…</li></ul></div>
    <p class="note" id="doneNote" hidden>Everything due today is checked off.</p>
  </section>

  <section aria-labelledby="weekH">
    <h2 id="weekH">Last 7 days</h2>
    <div class="week" id="week"></div>
  </section>

  <section aria-labelledby="addH">
    <h2 id="addH">Add a task</h2>
    <form id="addForm" autocomplete="off">
      <label class="f"><span>Task</span><input type="text" id="newTitle" maxlength="120" required placeholder="Take vitamins"></label>
      <label class="f"><span>Repeats</span>
        <select id="newWhen">
          <option value="daily">Every day</option>
          <option value="weekdays">Weekdays</option>
          <option value="weekends">Weekends</option>
          <option value="days">Certain days of the week</option>
          <option value="date">One date</option>
          <option value="dom">Day of the month</option>
        </select>
      </label>
      <fieldset id="daysBox" hidden>
        <legend>Days</legend>
        <div class="chips" id="chips"></div>
      </fieldset>
      <label class="f" id="dateBox" hidden><span>Date</span><input type="date" id="newDate"></label>
      <label class="f" id="domBox" hidden><span>Day of month</span><input type="number" id="newDom" min="1" max="31" value="1"></label>
      <p class="err" id="formErr" role="alert"></p>
      <button class="primary" type="submit">Add task</button>
    </form>
  </section>

  <section aria-labelledby="remH" id="remSection">
    <h2 id="remH">Morning reminder</h2>
    <form id="remForm" autocomplete="off">
      <p class="status" id="pushStatus" role="status">Off</p>
      <label class="f"><span>Send at</span>
        <select id="pushHour"></select>
      </label>
      <label class="f"><span>Worker address</span><input type="text" id="pushUrl" inputmode="url" autocapitalize="none" placeholder="https://daily-dos-push.your-name.workers.dev"></label>
      <label class="f"><span>Setup key</span><input type="password" id="pushKey" autocapitalize="none"></label>
      <p class="hint">On iPhone, add this page to your Home Screen and open it from there first. Requires iOS 16.4 or later.</p>
      <p class="err" id="pushErr" role="alert"></p>
      <div class="btns">
        <button class="primary" type="submit" id="pushOn">Turn on reminders</button>
        <button class="secondary" type="button" id="pushTest" hidden>Send a test</button>
        <button class="secondary" type="button" id="pushOff" hidden>Turn off</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="allH">
    <h2 id="allH">All tasks</h2>
    <div class="list" style="margin-top:12px"><ul id="all"><li class="empty">Loading…</li></ul></div>
  </section>
</main>

<script>
(function () {
  var DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  var CHIP_ORDER = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
  var DAY_NAMES = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat", sun: "Sun" };
  var tasks = [], done = {}, loadedTasks = false, loadedDone = false, db = null, writeChain = Promise.resolve();
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function isDue(when, d) {
    var parts = String(when || "daily").split(",");
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim().toLowerCase(), g = d.getDay();
      if (p === "daily") return true;
      if (p === "weekdays" && g >= 1 && g <= 5) return true;
      if (p === "weekends" && (g === 0 || g === 6)) return true;
      if (p === DAYS[g]) return true;
      if (p === iso(d)) return true;
      if (p.indexOf("day:") === 0 && Number(p.slice(4)) === d.getDate()) return true;
    }
    return false;
  }
  function describe(when) {
    var w = String(when || "daily").toLowerCase();
    if (w === "daily") return "Every day";
    if (w === "weekdays") return "Weekdays";
    if (w === "weekends") return "Weekends";
    if (w.indexOf("day:") === 0) return "Day " + w.slice(4) + " of each month";
    if (/^\d{4}-\d{2}-\d{2}$/.test(w)) {
      var p = w.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }
    return w.split(",").map(function (x) { return DAY_NAMES[x.trim()] || x; }).join(", ");
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    var now = new Date(), today = iso(now);
    $("weekday").textContent = now.toLocaleDateString(undefined, { weekday: "long" });
    $("dateLine").textContent = now.toLocaleDateString(undefined, { month: "long", day: "numeric" });

    if (!db) {
      $("count").textContent = "Saving isn't available in this view.";
      $("today").replaceChildren(el("li", "empty", "Open this page in Claude while signed in to see and check off your tasks."));
      $("all").replaceChildren(el("li", "empty", "No task list to show."));
      return;
    }
    if (!loadedTasks) return;

    var doneToday = new Set(done[today] || []);
    var dueToday = tasks.filter(function (t) { return isDue(t.when, now); });
    var nDone = dueToday.filter(function (t) { return doneToday.has(t.id); }).length;

    $("count").textContent = dueToday.length ? nDone + " of " + dueToday.length + " done" : "Nothing due today";
    $("barFill").style.width = dueToday.length ? Math.round(100 * nDone / dueToday.length) + "%" : "0%";
    $("doneNote").hidden = !(dueToday.length && nDone === dueToday.length);

    var ul = $("today");
    if (!dueToday.length) {
      ul.replaceChildren(el("li", "empty", tasks.length ? "Nothing is scheduled for today." : "No tasks yet. Add your first one below."));
    } else {
      ul.replaceChildren.apply(ul, dueToday.map(function (t) {
        var li = el("li"), row = el("div", "row" + (doneToday.has(t.id) ? " done" : "")), lab = el("label");
        var cb = el("input", "chk"); cb.type = "checkbox"; cb.checked = doneToday.has(t.id); cb.id = "chk-" + t.id;
        cb.addEventListener("change", function () { toggle(t.id, today); });
        lab.append(cb, el("span", "t", t.title)); row.append(lab); li.append(row); return li;
      }));
    }

    var week = $("week"), cells = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i), key = iso(d);
      var due = tasks.filter(function (t) { return isDue(t.when, d); });
      var ds = new Set(done[key] || []), n = due.filter(function (t) { return ds.has(t.id); }).length;
      var cell = el("div", "day" + (i === 0 ? " today" : "")), col = el("div", "col"), fill = el("i");
      fill.style.height = due.length ? Math.round(100 * n / due.length) + "%" : "0%";
      col.append(fill);
      cell.append(col, el("span", "n", due.length ? n + "/" + due.length : "–"), el("span", "l", d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 3).toUpperCase()));
      cells.push(cell);
    }
    week.replaceChildren.apply(week, cells);

    var all = $("all");
    if (!tasks.length) { all.replaceChildren(el("li", "empty", "No tasks yet.")); }
    else {
      all.replaceChildren.apply(all, tasks.map(function (t) {
        var li = el("li"), row = el("div", "row"), stack = el("div", "stack");
        stack.append(el("span", "t", t.title), el("span", "when", describe(t.when)));
        var del = el("button", "ghost", "Remove"); del.type = "button";
        del.setAttribute("aria-label", "Remove " + t.title);
        del.addEventListener("click", function () { removeTask(t.id); });
        row.append(stack, del); li.append(row); return li;
      }));
    }
  }

  function queueWrite(fn) {
    writeChain = writeChain.then(fn).catch(function (e) { $("formErr").textContent = "Couldn't save that change. Try again."; console.error(e); });
    return writeChain;
  }
  function toggle(id, date) {
    var cur = new Set(done[date] || []);
    if (cur.has(id)) cur.delete(id); else cur.add(id);
    var ids = Array.from(cur);
    done[date] = ids; render();
    queueWrite(function () { return db.doc("done/" + date).set({ date: date, ids: ids }); });
  }
  function removeTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; }); render();
    queueWrite(function () { return db.doc("tasks/" + id).delete(); });
  }

  // form
  var chips = $("chips");
  CHIP_ORDER.forEach(function (d) {
    var lab = el("label"), inp = el("input"); inp.type = "checkbox"; inp.value = d; inp.id = "chip-" + d;
    lab.append(inp, el("span", null, DAY_NAMES[d])); chips.append(lab);
  });
  $("newWhen").addEventListener("change", function () {
    var v = $("newWhen").value;
    $("daysBox").hidden = v !== "days"; $("dateBox").hidden = v !== "date"; $("domBox").hidden = v !== "dom";
  });
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("newTitle").value.trim(), kind = $("newWhen").value, when = kind, err = $("formErr");
    err.textContent = "";
    if (!title) { err.textContent = "Enter a task name."; return; }
    if (kind === "days") {
      var sel = CHIP_ORDER.filter(function (d) { return $("chip-" + d).checked; });
      if (!sel.length) { err.textContent = "Pick at least one day."; return; }
      when = sel.join(",");
    } else if (kind === "date") {
      if (!$("newDate").value) { err.textContent = "Pick a date."; return; }
      when = $("newDate").value;
    } else if (kind === "dom") {
      var n = Number($("newDom").value);
      if (!(n >= 1 && n <= 31)) { err.textContent = "Enter a day from 1 to 31."; return; }
      when = "day:" + n;
    }
    if (!db) { err.textContent = "Saving isn't available in this view."; return; }
    queueWrite(function () { return db.collection("tasks").add({ title: title, when: when, created: Date.now() }); });
    $("newTitle").value = ""; $("newTitle").focus();
  });


  // Saves to this device's localStorage when Claude's storage isn't available (GitHub Pages, home screen app).
  function localDb() {
    var KEY = "dailydos.v1", listeners = [], mem = {};
    try { mem = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { mem = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
    function notify() { listeners.slice().forEach(function (fn) { fn(); }); }
    function snap(col, order, dir, lim) {
      var c = mem[col] || {};
      var arr = Object.keys(c).map(function (id) { return { id: id, d: c[id] }; });
      if (order) arr.sort(function (a, b) {
        var x = a.d[order], y = b.d[order], r = x < y ? -1 : x > y ? 1 : 0;
        return dir === "desc" ? -r : r;
      });
      if (lim) arr = arr.slice(0, lim);
      return { docs: arr.map(function (x) { return { id: x.id, data: function () { return x.d; } }; }) };
    }
    function query(col, order, dir, lim) {
      return {
        orderBy: function (f, d) { return query(col, f, d || "asc", lim); },
        limit: function (n) { return query(col, order, dir, n); },
        onSnapshot: function (next) {
          var fn = function () { next(snap(col, order, dir, lim)); };
          listeners.push(fn); setTimeout(fn, 0);
          return function () { listeners = listeners.filter(function (f) { return f !== fn; }); };
        },
        add: function (data) {
          var id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          (mem[col] = mem[col] || {})[id] = data; save(); notify(); return Promise.resolve();
        }
      };
    }
    return {
      collection: query,
      doc: function (path) {
        var i = path.indexOf("/"), col = path.slice(0, i), id = path.slice(i + 1);
        return {
          set: function (data) { (mem[col] = mem[col] || {})[id] = data; save(); notify(); return Promise.resolve(); },
          delete: function () { if (mem[col]) delete mem[col][id]; save(); notify(); return Promise.resolve(); }
        };
      }
    };
  }

  // Copy tasks and check-offs where the service worker can read them for the morning notification.
  function mirror() {
    if (!loadedTasks) return;
    try {
      var req = indexedDB.open("dailydos", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("kv"); };
      req.onsuccess = function () {
        try {
          var tx = req.result.transaction("kv", "readwrite");
          tx.objectStore("kv").put({ tasks: tasks, done: done, at: Date.now() }, "state");
          tx.oncomplete = function () { req.result.close(); };
        } catch (e) {}
      };
    } catch (e) {}
  }

  render();
  (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null)).then(function (handle) {
    db = handle || localDb();
    db.collection("tasks").orderBy("created").onSnapshot(function (snap) {
      tasks = snap.docs.map(function (d) { var x = d.data() || {}; return { id: d.id, title: String(x.title || ""), when: x.when || "daily" }; });
      loadedTasks = true; render(); mirror();
    }, function () { loadedTasks = true; render(); });
    db.collection("done").orderBy("date", "desc").limit(14).onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (d) { var x = d.data() || {}; next[d.id] = Array.isArray(x.ids) ? x.ids : []; });
      done = next; loadedDone = true; render(); mirror();
    }, function () { loadedDone = true; });
  }).catch(function () { db = localDb(); render(); });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (window.claude) { $("remSection").hidden = true; return; }
  var KEY = "dailydos.push";
  function cfg() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(c) { try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }
  function hourLabel(h) { return (h % 12 || 12) + (h < 12 ? " AM" : " PM"); }
  [6, 7, 8, 9, 10, 12, 17, 20].forEach(function (h) {
    var o = document.createElement("option"); o.value = h; o.textContent = hourLabel(h); $("pushHour").append(o);
  });
  var c = cfg();
  $("pushHour").value = String(c.hour != null ? c.hour : 8);
  if (c.url) $("pushUrl").value = c.url;
  if (c.key) $("pushKey").value = c.key;
  function err(m) { $("pushErr").textContent = m || ""; }
  function supported() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
  function b64ToBytes(b) {
    var s = atob(b.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, function (ch) { return ch.charCodeAt(0); });
  }
  function api(path, body) {
    var conf = cfg();
    return fetch(conf.url + path, { method: "POST", headers: { "content-type": "application/json", "x-setup-key": conf.key }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "The Worker returned " + r.status + "."); return j; }); });
  }
  function show(on) {
    $("pushOn").hidden = on; $("pushTest").hidden = !on; $("pushOff").hidden = !on;
    var conf = cfg();
    $("pushStatus").textContent = on ? "On. Daily at " + hourLabel(conf.hour != null ? conf.hour : 8) + "." : "Off";
  }
  function refresh() {
    if (!supported()) { show(false); return; }
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (sub) { show(!!sub && cfg().enabled === true); }).catch(function () { show(false); });
  }

  $("remForm").addEventListener("submit", function (e) {
    e.preventDefault(); err("");
    var url = $("pushUrl").value.trim().replace(/\/+$/, ""), key = $("pushKey").value.trim(), hour = Number($("pushHour").value);
    if (!supported()) { err("Push isn't available here. On iPhone, add the app to your Home Screen and open it from there (iOS 16.4 or later)."); return; }
    if (url.indexOf("https://") !== 0) { err("Enter your Worker address, starting with https://"); return; }
    if (!key) { err("Enter your setup key."); return; }
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    save({ url: url, key: key, hour: hour, enabled: false });
    Notification.requestPermission().then(function (perm) {
      if (perm !== "granted") throw new Error("Notifications are blocked. Allow them for this app in your phone's Settings, then try again.");
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return fetch(url + "/vapid-key").then(function (r) { return r.json(); }).then(function (j) {
        return reg.pushManager.getSubscription().then(function (existing) {
          return existing || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(j.publicKey) });
        });
      });
    }).then(function (sub) {
      return api("/subscribe", { subscription: sub.toJSON(), tz: tz, hour: hour });
    }).then(function () {
      save({ url: url, key: key, hour: hour, enabled: true }); show(true);
    }).catch(function (ex) { err(ex && ex.message ? ex.message : "Couldn't turn on reminders."); });
  });

  $("pushTest").addEventListener("click", function () {
    err("");
    api("/test").then(function () { $("pushStatus").textContent = "Test sent. It should arrive in a few seconds."; })
      .catch(function (ex) { err(ex.message); });
  });
  $("pushOff").addEventListener("click", function () {
    err("");
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) return;
      var info = sub.toJSON();
      return api("/unsubscribe", { subscription: info }).catch(function () {}).then(function () { return sub.unsubscribe(); });
    }).then(function () { var conf = cfg(); conf.enabled = false; save(conf); show(false); })
      .catch(function (ex) { err(ex && ex.message ? ex.message : "Couldn't turn off reminders."); });
  });
  refresh();
})();
</script>
